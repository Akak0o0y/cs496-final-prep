<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CS496 Revision Guide</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#0b0d12; --panel:#13161d; --line:#262b36;
    --text:#e6e8ee; --muted:#8a93a6; --accent:#7c9cff; --accent-2:#5cd1c1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    line-height:1.65;font-size:15px}
  .wrap{max-width:900px;margin:0 auto;padding:40px 28px 80px}
  h1{font-size:28px;margin:0 0 4px;line-height:1.25}
  h2{font-size:22px;margin:38px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--accent)}
  h3{font-size:18px;margin:28px 0 10px;color:var(--accent-2)}
  h4{font-size:15px;margin:18px 0 6px;color:#cbd2e0}
  p{margin:8px 0}
  strong{color:#fff}
  em{color:#cbd2e0}
  code{background:#1a1f2c;padding:1px 6px;border-radius:4px;font-size:13px;color:#ffd58a}
  pre{background:#11141b;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;font-size:13px}
  pre code{background:transparent;padding:0;color:#cbd2e0}
  ul,ol{padding-left:22px;margin:6px 0}
  li{margin:3px 0}
  blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:4px 14px;color:var(--muted);background:#11141b;border-radius:4px}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0}
  table{border-collapse:collapse;margin:12px 0;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#1a1f2c;color:var(--accent)}
  tr:nth-child(even) td{background:#11141b}
  a{color:var(--accent)}
  .topbar{position:sticky;top:0;background:rgba(11,13,18,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;z-index:5}
  .topbar a{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:6px}
  .topbar a:hover{color:var(--text);border-color:#3a4253}
  .pill{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
  .err{color:#ffb4b4;padding:20px;background:#3a1f1f;border:1px solid #5a2b2b;border-radius:8px;margin:30px 0}

  /* Mobile */
  @media (max-width: 720px){
    body{font-size:14px}
    .wrap{padding:18px 14px 60px}
    h1{font-size:22px}
    h2{font-size:18px;margin:26px 0 10px}
    h3{font-size:16px;margin:20px 0 8px}
    h4{font-size:14px}
    pre{font-size:11px;padding:10px}
    code{font-size:12px}
    table{font-size:11px;display:block;overflow-x:auto;white-space:nowrap}
    th,td{padding:6px 8px}
    .topbar{padding:8px 14px;gap:8px}
    .topbar a{font-size:11px;padding:4px 8px}
    .pill{font-size:10px}
    ul,ol{padding-left:18px}
    li{font-size:14px}
  }
</style>
</head>
<body>
<div class="topbar">
  <a href="../">← Back to Portal</a>
  <span class="pill" id="moduleTag">CS496 Revision Guide</span>
</div>
<div class="wrap" id="content">Loading…</div>
<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const titles = {
  "quantum.md":"Quantum Computing",
  "blockchain.md":"Blockchain",
  "ai.md":"AI / Agentic AI"
};
if (!file || !titles[file]) {
  document.getElementById("content").innerHTML =
    '<div class="err">No guide selected. Append <code>?file=quantum.md</code>, <code>?file=ai.md</code> or <code>?file=blockchain.md</code> to the URL.</div>';
} else {
  document.getElementById("moduleTag").textContent = titles[file] + " — Ultimate Revision Guide";
  document.title = "CS496 — " + titles[file];
  fetch(file).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(md => {
    marked.setOptions({ gfm: true, breaks: false });
    document.getElementById("content").innerHTML = marked.parse(md);
  }).catch(e => {
    document.getElementById("content").innerHTML =
      '<div class="err">Could not load ' + file + ': ' + e.message + '</div>';
  });
}
</script>
</body>
</html>
